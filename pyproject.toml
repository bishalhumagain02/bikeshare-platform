[project]
name = "bikeshare-platform"
version = "0.1.0"
description = "Bike-Share Intelligence Platform — Capital Bikeshare (DC metro)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pandas>=2.2",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]
dagster-extra = [
    "dagster>=1.7",
    "dagster-webserver>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
