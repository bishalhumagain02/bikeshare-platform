# Archives the next-48h weather forecast once a day and uploads it to
# Backblaze B2. This is the time-sensitive one — a missed day is
# forecast history that cannot be recreated retroactively.

name: Archive weather forecast

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily — adjust if you want a different time
  workflow_dispatch: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Archive weather forecast
        env:
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: python -m src.ingestion.archive_weather_forecast
