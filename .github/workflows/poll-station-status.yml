# Polls Capital Bikeshare's live station_status and uploads each
# snapshot to Backblaze B2. Runs on GitHub's servers, not on any
# personal machine — solves the "my local daytime is DC's nighttime"
# coverage gap by not depending on any one timezone's machine being on.
#
# WHY repository_dispatch INSTEAD OF schedule: GitHub's own `schedule:`
# cron trigger is explicitly documented as best-effort and can be
# delayed by tens of minutes to HOURS, especially on new/low-activity
# repos (confirmed: this repo saw 2-3 hour delays with `schedule:`).
# repository_dispatch is fired by an external ping (see
# docs/cloud-setup.md — cron-job.org calls GitHub's REST API directly),
# which runs near-instantly instead of sitting in GitHub's internal
# scheduling queue.
#
# NOTE: GitHub disables scheduled/dispatched workflows automatically
# after 60 days with no repo activity (any commit/push resets that).

name: Poll station status

on:
  repository_dispatch:
    types: [poll-station-status]
  workflow_dispatch: {}  # lets you trigger a manual test run from the Actions tab

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Poll station status
        env:
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: python -m src.ingestion.poll_station_status
